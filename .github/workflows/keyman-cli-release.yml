name: Keyman CLI release

on:
  push:
    tags:
      - 'v*'
      - 'snapshot-*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS binaries
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build release binaries
        working-directory: mac/keyman-cli
        run: |
          set -euo pipefail

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target"
          done

      - name: Package release assets
        working-directory: mac/keyman-cli
        run: |
          set -euo pipefail

          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release -czf dist/keyman-macos-aarch64.tar.gz keyman
          tar -C target/x86_64-apple-darwin/release -czf dist/keyman-macos-x86_64.tar.gz keyman

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == snapshot-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG" mac/keyman-cli/dist/*.tar.gz "${release_args[@]}"
